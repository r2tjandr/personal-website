<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/profile.jpg' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">RICKY TJANDRA, PhD</a>
    <nav>
      <ul>
        <li><a href="{{ '/consulting' | relative_url }}"{% if page.url contains '/consulting' %} class="active" aria-current="page"{% endif %}>Consulting</a></li>
        <li><a href="{{ '/resume/' | relative_url }}"{% if page.url contains '/resume' %} class="active" aria-current="page"{% endif %}>Résumé</a></li>
        <li><a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} class="active" aria-current="page"{% endif %}>Publications</a></li>
      </ul>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</span>
    <a href="mailto:{{ site.email }}">Email</a>
    <a href="https://www.linkedin.com/in/rickytjandra/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://scholar.google.com/citations?user=dbi2ccsAAAAJ&amp;hl=en" target="_blank" rel="noopener">Google Scholar</a>
  </footer>
</body>
</html>
